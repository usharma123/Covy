name: Experiment Manifest

on:
  pull_request:
    paths:
      - ".github/workflows/experiment-manifest.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/experiments/**"
      - "crates/suite-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/experiment-manifest.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/experiments/**"
      - "crates/suite-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Packet28 CLI
        run: cargo build -p suite-cli

      - name: Verify experiment manifest
        run: target/debug/Packet28 verify experiments --root . --json
