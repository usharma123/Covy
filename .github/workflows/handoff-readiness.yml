name: Handoff Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/handoff-readiness.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "crates/suite-cli/src/cmd_dashboard.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_mcp_native.rs"
      - "crates/suite-cli/tests/governed_workflow_e2e.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/handoff-readiness.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "crates/suite-cli/src/cmd_dashboard.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_mcp_native.rs"
      - "crates/suite-cli/tests/governed_workflow_e2e.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-handoffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build Packet28 CLI
        run: cargo build --locked -p suite-cli

      - name: Verify handoff readiness
        run: target/debug/Packet28 verify handoffs --root . --max-regressions 0
