name: Hook Benchmark Suite

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark-hook-suite.yml"
      - "scripts/benchmark_hook_rewrite.py"
      - "scripts/benchmark_hook_suite.py"
      - "scripts/validate_hook_benchmarks.py"
      - "scripts/benchmark_native_mcp.py"
      - "scripts/validate_native_benchmarks.py"
      - "scripts/bench_agentic_coding_task.py"
      - "scripts/benchmark_common.py"
      - "scripts/hook_benchmark_thresholds.py"
      - "crates/packet28-reducer-core/**"
      - "crates/packet28-search-cli/**"
      - "crates/packet28-search-core/**"
      - "crates/suite-cli/**"
      - "crates/packet28d/**"
      - "crates/packet28-daemon-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmark-hook-suite.yml"
      - "scripts/benchmark_hook_rewrite.py"
      - "scripts/benchmark_hook_suite.py"
      - "scripts/validate_hook_benchmarks.py"
      - "scripts/benchmark_native_mcp.py"
      - "scripts/validate_native_benchmarks.py"
      - "scripts/bench_agentic_coding_task.py"
      - "scripts/benchmark_common.py"
      - "scripts/hook_benchmark_thresholds.py"
      - "crates/packet28-reducer-core/**"
      - "crates/packet28-search-cli/**"
      - "crates/packet28-search-core/**"
      - "crates/suite-cli/**"
      - "crates/packet28d/**"
      - "crates/packet28-daemon-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Install benchmark system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ripgrep

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Build benchmark dependencies
        run: cargo build --locked -p suite-cli -p packet28d -p packet28-reducer-core -p packet28-search-cli

      - name: Run hook grep regression tests
        run: cargo test --locked -p suite-cli grep

      - name: Run p28 search CLI tests
        run: cargo test --locked -p packet28-search-cli --tests

      - name: Run hook benchmark suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/benchmark_hook_suite.py \
            --root "$GITHUB_WORKSPACE" \
            --gh-repo "${{ github.repository }}" \
            --artifact-dir "$GITHUB_WORKSPACE/.packet28/benchmarks/ci-hook-suite"

      - name: Run native MCP benchmark suite
        run: |
          python3 scripts/benchmark_native_mcp.py \
            --root "$GITHUB_WORKSPACE" \
            --artifact-dir "$GITHUB_WORKSPACE/.packet28/benchmarks/ci-native-suite"

      - name: Run agentic tokenomics benchmark
        run: |
          python3 scripts/bench_agentic_coding_task.py \
            --artifact-dir "$GITHUB_WORKSPACE/.packet28/benchmarks/ci-agentic-tokenomics" \
            --min-slim-savings-pct 90 \
            --min-with-artifacts-savings-pct 50

      - name: Validate hook benchmark thresholds
        run: |
          python3 scripts/validate_hook_benchmarks.py \
            "$GITHUB_WORKSPACE/.packet28/benchmarks/ci-hook-suite/summary.json" \
            --markdown-path "$GITHUB_WORKSPACE/.packet28/benchmarks/ci-hook-suite/validation.md"

      - name: Validate native MCP benchmark thresholds
        run: |
          python3 scripts/validate_native_benchmarks.py \
            "$GITHUB_WORKSPACE/.packet28/benchmarks/ci-native-suite/summary.json" \
            --markdown-path "$GITHUB_WORKSPACE/.packet28/benchmarks/ci-native-suite/validation.md"

      - name: Publish workflow summary
        run: |
          {
            cat .packet28/benchmarks/ci-hook-suite/summary.md
            printf '\n'
            cat .packet28/benchmarks/ci-hook-suite/validation.md
            printf '\n'
            cat .packet28/benchmarks/ci-native-suite/summary.md
            printf '\n'
            cat .packet28/benchmarks/ci-native-suite/validation.md
            printf '\n'
            cat .packet28/benchmarks/ci-agentic-tokenomics/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hook benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-suites
          path: .packet28/benchmarks
