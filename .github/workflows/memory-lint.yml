name: Memory Lint

on:
  pull_request:
    paths:
      - ".github/workflows/memory-lint.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/memory-lint/**"
      - "crates/suite-cli/src/cmd_dashboard.rs"
      - "crates/suite-cli/src/cmd_memory.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/memory_store.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/memory-lint.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/memory-lint/**"
      - "crates/suite-cli/src/cmd_dashboard.rs"
      - "crates/suite-cli/src/cmd_memory.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/memory_store.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build Packet28 CLI
        run: cargo build --locked -p suite-cli

      - name: Verify memory lint fixtures
        run: |
          set -o pipefail
          target/debug/Packet28 verify memory-lint --root . --json | tee memory-lint.json

      - name: Summarize memory lint
        if: always()
        run: |
          {
            echo "### Memory lint"
            echo "- issues: $(jq -r '.issue_count // 0' memory-lint.json)"
            echo "- expected kinds: $(jq -r '(.expected_issue_kinds // []) | join(",")' memory-lint.json)"
          } >> "$GITHUB_STEP_SUMMARY"
