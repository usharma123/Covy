name: Memory Lint

on:
  pull_request:
    paths:
      - ".github/workflows/memory-lint.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/memory-lint/**"
      - "crates/suite-cli/src/cmd_memory.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/memory_store.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/memory-lint.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/memory-lint/**"
      - "crates/suite-cli/src/cmd_memory.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/memory_store.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Packet28 CLI
        run: cargo build -p suite-cli

      - name: Verify memory lint fixtures
        run: target/debug/Packet28 verify memory-lint --root . --json
