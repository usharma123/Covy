name: Reducer Drift

on:
  pull_request:
    paths:
      - ".github/workflows/reducer-drift.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/reducer-drift/**"
      - "crates/packet28-reducer-core/**"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reducer-drift.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/reducer-drift/**"
      - "crates/packet28-reducer-core/**"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Packet28 CLI
        run: cargo build -p suite-cli

      - name: Verify reducer drift fixtures
        run: target/debug/Packet28 verify reducer-drift --root . --json
