name: Reducer Drift

on:
  pull_request:
    paths:
      - ".github/workflows/reducer-drift.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/reducer-drift/**"
      - "crates/packet28-reducer-core/**"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reducer-drift.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/reducer-drift/**"
      - "crates/packet28-reducer-core/**"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build Packet28 CLI
        run: cargo build --locked -p suite-cli

      - name: Verify reducer drift fixtures
        run: target/debug/Packet28 verify reducer-drift --root . --json
