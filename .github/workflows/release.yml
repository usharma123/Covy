name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release gate dependencies
        run: cargo build -p suite-cli -p packet28d -p packet28-reducer-core -p packet28-search-cli

      - name: Run p28 search CLI tests
        run: cargo test -p packet28-search-cli --tests

      - name: Run reducer cache safety tests
        run: |
          cargo test -p suite-cli rust_workspace_fingerprint_changes_for_out_of_band_source_edit
          cargo test -p suite-cli agent_status_reports_safe_cache_policy
          cargo test -p suite-cli test_packet28_hook_reducer_runner_reuses_cached_summary_without_rerunning_command --test e2e_smoke
          cargo test -p suite-cli test_packet28_hook_reducer_runner_busts_cache_after_out_of_band_file_edit --test e2e_smoke

      - name: Run hook benchmark suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/benchmark_hook_suite.py \
            --root "$GITHUB_WORKSPACE" \
            --gh-repo "${{ github.repository }}" \
            --artifact-dir "$GITHUB_WORKSPACE/.packet28/benchmarks/release-hook-suite"

      - name: Run native MCP benchmark suite
        run: |
          python3 scripts/benchmark_native_mcp.py \
            --root "$GITHUB_WORKSPACE" \
            --artifact-dir "$GITHUB_WORKSPACE/.packet28/benchmarks/release-native-suite"

      - name: Validate hook benchmark thresholds
        run: |
          python3 scripts/validate_hook_benchmarks.py \
            "$GITHUB_WORKSPACE/.packet28/benchmarks/release-hook-suite/summary.json" \
            --markdown-path "$GITHUB_WORKSPACE/.packet28/benchmarks/release-hook-suite/validation.md"

      - name: Validate native MCP benchmark thresholds
        run: |
          python3 scripts/validate_native_benchmarks.py \
            "$GITHUB_WORKSPACE/.packet28/benchmarks/release-native-suite/summary.json" \
            --markdown-path "$GITHUB_WORKSPACE/.packet28/benchmarks/release-native-suite/validation.md"

      - name: Check manifest artifacts are committed
        run: node scripts/check_experiment_manifest_artifacts_tracked.mjs

      - name: Verify experiment manifest
        run: |
          target/debug/Packet28 verify experiments --root . --json \
            --require-workflow "Claude Code, Gemini, and OpenCode runtime integration smoke" \
            --require-workflow "Packet28 real repository parity and indexed search evidence across packet28, ripgrep, and fd" \
            --require-workflow "Packet28 repeatable fixture-suite smoke across Rust, Node, and docs repositories" \
            --require-workflow "Optional fff MCP search backend comparison and adapter smoke" \
            --require-workflow "Packet28 broker plan validation CLI with mapped test-gate score evidence" \
            --require-workflow "Packet28 code-navigation experiment on ClaudeCode main source snapshot" \
            --require-workflow "Packet28 versus normal tools on a generated agentic Rust bug-fix task" \
            --require-workflow "Packet28 release smoke for published npm package and install path"

      - name: Verify release notes
        run: |
          set -euo pipefail
          test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Publish release gate summary
        if: always()
        run: |
          for file in \
            .packet28/benchmarks/release-hook-suite/summary.md \
            .packet28/benchmarks/release-hook-suite/validation.md \
            .packet28/benchmarks/release-native-suite/summary.md \
            .packet28/benchmarks/release-native-suite/validation.md; do
            if [ -f "$file" ]; then
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-benchmarks
          path: .packet28/benchmarks

  build:
    needs: release-gates
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - target: x86_64-apple-darwin
            os: macos-14
            platform: darwin-x64
            npm_os: darwin
            npm_cpu: x64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x64
            npm_os: linux
            npm_cpu: x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-arm64
            npm_os: linux
            npm_cpu: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }} --bin Packet28 --bin packet28d --bin p28
          else
            cargo build --release --target ${{ matrix.target }} --bin Packet28 --bin packet28d --bin p28
          fi

      - name: Stage platform package
        run: |
          PKG_DIR="dist/@packet28/${{ matrix.platform }}"
          mkdir -p "$PKG_DIR/bin"

          cp target/${{ matrix.target }}/release/Packet28 "$PKG_DIR/bin/"
          cp target/${{ matrix.target }}/release/packet28d "$PKG_DIR/bin/"
          cp target/${{ matrix.target }}/release/p28 "$PKG_DIR/bin/"

          # Ensure binaries are executable
          chmod +x "$PKG_DIR/bin/Packet28" "$PKG_DIR/bin/packet28d" "$PKG_DIR/bin/p28"

          # Strip binaries to reduce size
          if command -v strip &> /dev/null; then
            strip "$PKG_DIR/bin/Packet28" "$PKG_DIR/bin/packet28d" "$PKG_DIR/bin/p28" 2>/dev/null || true
          fi

          # Generate package.json from template
          VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s/PLATFORM/${{ matrix.platform }}/g" \
              -e "s/\"OS\"/\"${{ matrix.npm_os }}\"/g" \
              -e "s/\"CPU\"/\"${{ matrix.npm_cpu }}\"/g" \
              npm/platform-template/package.json > "$PKG_DIR/package.json"
          VERSION="$VERSION" PACKAGE_JSON="$PKG_DIR/package.json" node <<'NODE'
          const fs = require('fs');
          const pkgPath = process.env.PACKAGE_JSON;
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Upload platform package
        uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.platform }}
          path: dist/@packet28/${{ matrix.platform }}

  publish:
    needs:
      - release-gates
      - build
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all platform packages
        uses: actions/download-artifact@v7
        with:
          path: dist/platforms

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REGISTRY="https://registry.npmjs.org"

          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            PKG_DIR="dist/platforms/pkg-${platform}"
            PACKAGE_NAME="@packet28/${platform}"

            if npm view "${PACKAGE_NAME}@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${VERSION} already published, skipping"
              continue
            fi

            echo "Publishing ${PACKAGE_NAME}@${VERSION}..."
            if ! (cd "$PKG_DIR" && npm publish --access public --provenance --registry="$REGISTRY"); then
              if npm view "${PACKAGE_NAME}@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
                echo "${PACKAGE_NAME}@${VERSION} was published concurrently, skipping"
                continue
              fi
              exit 1
            fi
          done

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REGISTRY="https://registry.npmjs.org"

          # Stage root package
          ROOT_DIR="dist/packet28"
          cp -r npm/packet28/ "$ROOT_DIR/"
          VERSION="$VERSION" PACKAGE_JSON="$ROOT_DIR/package.json" node <<'NODE'
          const fs = require('fs');
          const pkgPath = process.env.PACKAGE_JSON;
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          for (const name of ['@packet28/darwin-arm64', '@packet28/darwin-x64', '@packet28/linux-x64', '@packet28/linux-arm64']) {
            if (pkg.optionalDependencies && pkg.optionalDependencies[name]) {
              pkg.optionalDependencies[name] = version;
            }
          }
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          chmod +x "$ROOT_DIR/bin/packet28.js" "$ROOT_DIR/bin/packet28-mcp.js" "$ROOT_DIR/bin/p28.js"

          if npm view "packet28@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
            echo "packet28@${VERSION} already published, skipping"
            exit 0
          fi
          echo "Publishing packet28@${VERSION}..."
          if ! (cd "$ROOT_DIR" && npm publish --access public --provenance --registry="$REGISTRY"); then
            if npm view "packet28@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "packet28@${VERSION} was published concurrently, skipping"
              exit 0
            fi
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Packet28 ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all binaries first
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace
