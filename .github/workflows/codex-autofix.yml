name: Codex Autofix

on:
  workflow_run:
    workflows:
      - Build
      - Hook Benchmark Suite
      - Context Anomalies
      - Experiment Manifest
      - Handoff Readiness
      - Memory Lint
      - Reducer Drift
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed GitHub Actions run id to inspect"
        required: true
      ref:
        description: "Git ref to check out"
        required: false
        default: main

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: codex-autofix-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.name != 'Codex Autofix'
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, inputs.run_id) }}
      CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_AUTOFIX_VERIFY: cargo test --locked --workspace --all-targets
    steps:
      - name: Require OpenAI credentials
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "OPENAI_API_KEY is not configured; skipping Codex autofix."
          exit 78

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Validate autofix script
        run: |
          bash -n scripts/ci/codex_autofix.sh
          mkdir -p .packet28/ci-autofix
          printf 'simulated failing test log\n' > .packet28/ci-autofix/failure.log
          CODEX_AUTOFIX_DRY_RUN=1 \
            CI_FAILURE_LOG="$GITHUB_WORKSPACE/.packet28/ci-autofix/failure.log" \
            CI_RUN_URL="$RUN_URL" \
            scripts/ci/codex_autofix.sh
          test -s .packet28/ci-autofix/prompt.txt

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"

      - name: Install Codex CLI
        run: |
          if ! command -v codex >/dev/null 2>&1; then
            npm install -g @openai/codex
          fi
          codex --version

      - name: Capture failed run logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .packet28/ci-autofix
          gh run view "$RUN_ID" --log > .packet28/ci-autofix/failure.log
          test -s .packet28/ci-autofix/failure.log

      - name: Run Codex autofix
        env:
          CI_FAILURE_LOG: ${{ github.workspace }}/.packet28/ci-autofix/failure.log
          CI_RUN_URL: ${{ env.RUN_URL }}
        run: scripts/ci/codex_autofix.sh

      - name: Verify generated fix
        run: |
          if git diff --quiet -- . ':!.packet28'; then
            echo "No autofix diff was produced."
            exit 0
          fi
          cargo fmt --check
          bash -lc "$CODEX_AUTOFIX_VERIFY"

      - name: Open autofix pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- . ':!.packet28'; then
            echo "No changes to publish."
            exit 0
          fi
          branch="codex-autofix/run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git restore --staged .packet28 || true
          git commit -m "Codex autofix for CI run ${RUN_ID}"
          git push --force-with-lease origin "$branch"
          body_file=".packet28/ci-autofix/pr-body.md"
          {
            echo "Automated Codex attempt to fix failing CI run ${RUN_URL}."
            echo
            if test -s .packet28/ci-autofix/final.md; then
              echo "## Codex summary"
              cat .packet28/ci-autofix/final.md
            fi
          } > "$body_file"
          existing_pr="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')"
          if test -n "$existing_pr"; then
            gh pr edit "$existing_pr" --body-file "$body_file"
          else
            gh pr create \
              --draft \
              --title "Codex autofix for CI run ${RUN_ID}" \
              --body-file "$body_file" \
              --base main \
              --head "$branch"
          fi

      - name: Upload autofix artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-autofix-${{ env.RUN_ID }}
          path: .packet28/ci-autofix
