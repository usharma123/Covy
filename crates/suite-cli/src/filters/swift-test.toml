[filters.swift-test]
description = "Compact swift test output — summarize passing suites and keep failures"
match_command = "^swift\\s+test\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^CompileSwift ",
  "^Compiling ",
  "^Linking ",
]
match_output = [
  { pattern = "Test Suite 'All tests' passed", message = "ok (swift tests passed)", unless = "failed|error:" },
]
max_lines = 60

[[tests.swift-test]]
name = "successful test short-circuits to ok"
input = """
CompileSwift normal x86_64 MyTests.swift
Test Suite 'All tests' passed at 2026-05-12 10:00:00.000.
	 Executed 8 tests, with 0 failures (0 unexpected) in 0.123 (0.124) seconds
"""
expected = "ok (swift tests passed)"

[[tests.swift-test]]
name = "failed tests keep assertion context"
input = """
Compiling MyPackageTests MyTests.swift
Test Case '-[MyPackageTests.MathTests testAdds]' failed (0.001 seconds)
/workspace/Tests/MathTests.swift:12: error: XCTAssertEqual failed: ("3") is not equal to ("4")
Test Suite 'All tests' failed at 2026-05-12 10:00:00.000.
	 Executed 8 tests, with 1 failure (0 unexpected) in 0.123 (0.124) seconds
"""
expected = "Test Case '-[MyPackageTests.MathTests testAdds]' failed (0.001 seconds)\n/workspace/Tests/MathTests.swift:12: error: XCTAssertEqual failed: (\"3\") is not equal to (\"4\")\nTest Suite 'All tests' failed at 2026-05-12 10:00:00.000.\n\t Executed 8 tests, with 1 failure (0 unexpected) in 0.123 (0.124) seconds"
